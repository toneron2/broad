[tool.poetry]
name = "healthcare-workflow-library-mcp"
version = "1.0.0"
description = "MCP Server for Healthcare Workflow Library - Deploy and manage standardized clinical pathways"
authors = ["BROAD Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
mcp = "^1.0.0"
httpx = "^0.27.0"
pydantic = "^2.0.0"
pyyaml = "^6.0"
lxml = "^5.0.0"
python-dotenv = "^1.0.0"
opentelemetry-api = "^1.20.0"
opentelemetry-sdk = "^1.20.0"
opentelemetry-exporter-otlp = "^1.20.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mcp-healthcare-workflows = "src.main:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
